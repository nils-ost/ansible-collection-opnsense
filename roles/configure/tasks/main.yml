- name: Validate NAT config
  ansible.utils.validate:
    data: "{{ opnsense_nat_outbound }}"
    criteria:
      - "{{ lookup('file',  '../criteria/opnsense_nat_outbound.json') | from_json }}"
    engine: ansible.utils.jsonschema
  when: opnsense_nat_outbound.keys() | length > 0

- name: Validate shaper pipes config
  ansible.utils.validate:
    data: "{{ opnsense_shaper_pipes }}"
    criteria:
      - "{{ lookup('file',  '../criteria/opnsense_shaper_pipes.json') | from_json }}"
    engine: ansible.utils.jsonschema
  when: opnsense_shaper_pipes.keys() | length > 0

